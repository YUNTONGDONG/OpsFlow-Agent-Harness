faiss-cpu = {version = ">=1.8,<2", optional = true}
sentence-transformers = {version = ">=3,<6", optional = true}

[tool.poetry.extras]
rag = ["faiss-cpu", "sentence-transformers"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
